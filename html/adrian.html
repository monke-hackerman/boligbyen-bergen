<!DOCTYPE html>
<html lang="no">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adrian Sæthre</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/adrian.css">
</head>

<body>

  <header>
    <div id="navbar">
      <object
        data="navbar.html"
        type="text/html"
        style="width: 100%; height: 60px;"
        aria-label="Main Navigation"
        >
      </object>
    </div>
  </header>

  <main id="main">

    <h1 id="melding" style="color: white;"></h1>

    <p id="instruksjon" style="color: white;">
      Klikk barten 10 ganger!!!
    </p>

    <img id="adrian3" alt="Adrian">

    <button id="moustache-spin" class="img-button KlarerIkkeTaMeg" type="button" onclick="fireConfetti(0.3, 0.5)">
      <img src="../img/Realistisk krøllet brun bart.png" alt="mustache">
    </button>

    <button
      id="moustache2"
      class="moustache2-display"
      type="button">
      <img src="../img/Realistisk krøllet brun bart.png" alt="mustache">
    </button>

  </main>

  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.4/dist/confetti.browser.min.js"></script>

  <script>
    let z = 0;
    function fireConfetti(x, y) {

      for (let i = 0; i < 6; i += 2) {
        confetti({
          particleCount: 100,
          spread: 70,
          origin: {
            x: x + i * 0.1,
            y: y
          }
        });
      }

      z++;

      document.getElementById("melding").innerHTML =
        "Gratulerer! Du har trykket på barten " + z + " av 10 ganger!";

      if (z >= 1) {
        document.getElementById("instruksjon").style.display = "none";
      }

      if (z == 10) {

        const adrian = document.getElementById("adrian3");
        const first = document.getElementById("moustache-spin");
        const moustache = document.getElementById("moustache2");

        document.getElementById("melding").innerHTML = "Yippie!!!";

        adrian.src = "../img/adrian3.png";

        first.style.animation = "none";
        first.style.display = "none";

        moustache.style.display = "block";
        moustache.classList.add("flytte");
        setTimeout(function() {

          confetti({
            particleCount: 100,
            spread: 70,
            origin: {
              x: 0.5,
              y: 0.5
            }
          });

          createMoustaches();

        }, 6000);
      }
    }

    function createMoustaches() {

      const main = document.getElementById("main");

      for (let i = 0; i < 30; i++) {

        const img = document.createElement("img");

        img.src = "../img/Realistisk krøllet brun bart.png";
        img.alt = "mustache";
        img.className = "massebart";

        img.style.left = Math.random() * 90 + "%";
        img.style.top = Math.random() * 90 + "%";

        img.onclick = function() {

          const r = img.getBoundingClientRect();

          confetti({
            particleCount: 100,
            spread: 70,
            origin: {
              x: (r.left + r.width / 2) / innerWidth,
              y: (r.top + r.height / 2) / innerHeight
            }
          });
        };

        main.appendChild(img);
      }
    }
  </script>

</body>

</html>
