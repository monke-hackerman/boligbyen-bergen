<!DOCTYPE html>
<html lang="no">
<head>
  <title>Marius Alexander Aven </title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="../img/logo-small.png">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/marius.css">
</head>
<body>
  <header>
    <div id="navbar">
      <object data="navbar.html" type="text/html" style="width: 100%; height: 60px;"
        aria-label="navigasjonsbar: Hovedside, Tjenester og Prosjekter, Vedlikeholdsansvar, Om oss, Bestill og Kontakt"></object>
    </div>
  </header>

  <main>
    <div class="container marius-boks">
      <img src="../img/sealion swag.avif" alt="Bilde av Marius" class="marius-bilde">

      
      <div id="valg-del">
        <h1>Hei, Æ e Marius!</h1>
        <p class="ingress">Hva vil du vite om mæ? Du får bare velge <strong>én</strong> ting, så velg med omhu...</p>

        <div id="knapper" class="knapper">
          <button class="valg-knapp" data-valg="farge">🎨 Favorittfarge</button>
          <button class="valg-knapp" data-valg="funfact">🤯 Fun fact</button>
          <button class="valg-knapp" data-valg="mat">🍕 Favorittmat</button>
          <button class="valg-knapp" data-valg="hobby">🎮 Hobby</button>
          <button class="valg-knapp" data-valg="studie">💻 Swag</button>
          <button class="valg-knapp" data-valg="hemmelig">❓ Hemmelig valg</button>
        </div>
      </div>

      
      <div id="svar" class="svar skjult">
        <h1 id="svar-tittel"></h1>
        <p id="svar-tekst"></p>
        <p class="refresh-tips">Vil du vite noe annet? Da må du refreshe siden 😉</p>
      </div>
    </div>
  </main>

  <script>
    
    const svar = {
      farge: {
        tittel: "Favorittfargen min er blå",
        tekst: "Det e fordi den minner mæ om sjøløva, æ like sjøløva",
        bakgrunn: "#2b6cb0" 
      },
      funfact: {
        tittel: "Fun fact",
        tekst: "Noe morsomt med mæ e at æ like sjøløver",
        sjoloeve: true   // viser sjøløva som bakgrunn
      },
      mat: {
        tittel: "Favorittmaten min",
        tekst: "Ikke sjøløva, kanskje pizza eller en god beef, men æ like sjøløva"
      },
      hobby: {
        tittel: "Hobbyen min",
        tekst: "Æ driv med artige ting sjø(løva) som å se på youtube reels, 4 timer på rad every day. Hvis æ ikke gjør det, så bokser æ eller sover "
      },
      studie: {
        tittel: "Æ studerer dataingeniør",
        tekst: "lwk æ vet ikke ka æ driv med, men æ like sjøløva"
      },
      hemmelig: {
        tittel: "...",
        tekst: "My name is Marius Aven. I'm 20 years old. My house is in the northeast section of Bergen, where all the villas are, and I am not married. I work as an employee for the Sumo stores, and I get home every day by 10 PM at the latest. I don't smoke, but I occasionally drink. I'm in bed by 11 PM, and make sure I get eight hours of sleep, no matter what. After having a glass of warm milk and doing about twenty minutes of stretches before going to bed, I usually have no problems sleeping until morning. Just like a baby, I wake up without any fatigue or stress in the morning. I was told there were no issues at my last check-up. I'm trying to explain that I'm a person who wishes to live a very quiet life. I take care not to trouble myself with any enemies, like winning and losing, that would cause me to lose sleep at night. That is how I deal with society, and I know that is what brings me happiness. Although, if I were to fight I wouldn't lose to anyone"

      }
    };

    const knapper = document.querySelectorAll(".valg-knapp");

    knapper.forEach(function (knapp) {
      knapp.addEventListener("click", function () {
        const valgt = svar[knapp.dataset.valg];

        // Valgene forsvinner
        document.getElementById("valg-del").classList.add("ton-ut");

        // det e bare svaret som vises
        setTimeout(function () {
          document.getElementById("valg-del").remove();

          document.getElementById("svar-tittel").textContent = valgt.tittel;
          document.getElementById("svar-tekst").textContent = valgt.tekst;
          document.getElementById("svar").classList.remove("skjult");

          if (valgt.bakgrunn) {
            document.body.style.backgroundColor = valgt.bakgrunn;
          }

          if (valgt.sjoloeve) {
            document.body.classList.add("sjoloeve-bakgrunn");
          }
        }, 500);
      });
    });
  </script>
</body>
</html>
